version: '3.8'

services:
  # 1. Nginx High-Performance Load Balancer (Entrypoint)
  nginx:
    image: nginx:alpine
    container_name: vodil_nginx_lb
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - vodil_network

  # 2. Replicated NestJS Application Servers (Multi-Instance Scaling)
  backend-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vodil_backend_node_1
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_TYPE=postgres
      - DATABASE_HOST=pgbouncer
      - DATABASE_PORT=6432
      - DATABASE_NAME=vodil_eats
      - DATABASE_USER=vodil_admin
      - DATABASE_PASSWORD=vodil_secret_2024
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=vodil-eats-jwt-super-secret-key-2024
      - JWT_REFRESH_SECRET=vodil-eats-refresh-super-secret-key-2024
    depends_on:
      - pgbouncer
      - redis
    networks:
      - vodil_network

  backend-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vodil_backend_node_2
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_TYPE=postgres
      - DATABASE_HOST=pgbouncer
      - DATABASE_PORT=6432
      - DATABASE_NAME=vodil_eats
      - DATABASE_USER=vodil_admin
      - DATABASE_PASSWORD=vodil_secret_2024
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=vodil-eats-jwt-super-secret-key-2024
      - JWT_REFRESH_SECRET=vodil-eats-refresh-super-secret-key-2024
    depends_on:
      - pgbouncer
      - redis
    networks:
      - vodil_network

  backend-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vodil_backend_node_3
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_TYPE=postgres
      - DATABASE_HOST=pgbouncer
      - DATABASE_PORT=6432
      - DATABASE_NAME=vodil_eats
      - DATABASE_USER=vodil_admin
      - DATABASE_PASSWORD=vodil_secret_2024
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=vodil-eats-jwt-super-secret-key-2024
      - JWT_REFRESH_SECRET=vodil-eats-refresh-super-secret-key-2024
    depends_on:
      - pgbouncer
      - redis
    networks:
      - vodil_network

  # 3. PgBouncer Connection Pooler (Handles 10,000+ Concurrent Database Connections)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: vodil_pgbouncer
    restart: always
    environment:
      - DB_USER=vodil_admin
      - DB_PASSWORD=vodil_secret_2024
      - DB_HOST=postgres
      - DB_NAME=vodil_eats
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=50
    ports:
      - "6432:6432"
    depends_on:
      - postgres
    networks:
      - vodil_network

  # 4. PostgreSQL 15 + PostGIS (Spatial Database)
  postgres:
    image: postgis/postgis:15-3.4
    container_name: vodil_postgres_master
    restart: always
    environment:
      - POSTGRES_DB=vodil_eats
      - POSTGRES_USER=vodil_admin
      - POSTGRES_PASSWORD=vodil_secret_2024
    command: >
      postgres
      -c max_connections=500
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - vodil_network

  # 5. Redis 7 High-Throughput In-Memory Data Store (GEO + Caching)
  redis:
    image: redis:7-alpine
    container_name: vodil_redis_prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru --tcp-backlog 511
    ports:
      - "6379:6379"
    volumes:
      - redisdata_prod:/data
    networks:
      - vodil_network

volumes:
  pgdata_prod:
  redisdata_prod:

networks:
  vodil_network:
    driver: bridge
