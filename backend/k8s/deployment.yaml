apiVersion: apps/v1
kind: Deployment
metadata:
  name: vodil-eats-backend
  namespace: vodil-eats
  labels:
    app: vodil-eats-backend
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vodil-eats-backend
  template:
    metadata:
      labels:
        app: vodil-eats-backend
    spec:
      containers:
      - name: backend
        image: vodil-eats/backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2048Mi"
        envFrom:
        - configMapRef:
            name: vodil-backend-config
        - secretRef:
            name: vodil-backend-secrets
        livenessProbe:
          httpGet:
            path: /api/v1/restaurants
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/v1/restaurants
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vodil-eats-backend-svc
  namespace: vodil-eats
spec:
  type: ClusterIP
  selector:
    app: vodil-eats-backend
  ports:
  - name: http
    port: 80
    targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vodil-eats-hpa
  namespace: vodil-eats
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vodil-eats-backend
  minReplicas: 5
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
