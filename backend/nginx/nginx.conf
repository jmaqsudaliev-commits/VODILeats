user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;
    reset_timedout_connection on;

    # Gzip Compression for 1M+ user mobile bandwidth efficiency
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/truetype
        font/opentype
        image/svg+xml;

    # Upstream Backend Nodes (Load Balanced)
    upstream backend_cluster {
        least_conn; # Route to node with fewest active connections
        server backend-1:3000 max_fails=3 fail_timeout=10s;
        server backend-2:3000 max_fails=3 fail_timeout=10s;
        server backend-3:3000 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    # Upstream WebSockets (Sticky sessions via IP hash)
    upstream websocket_cluster {
        ip_hash;
        server backend-1:3000;
        server backend-2:3000;
        server backend-3:3000;
        keepalive 128;
    }

    server {
        listen 80;
        server_name api.vodileats.uz;

        # Rate limiting zone (DDoS protection)
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
        }

        # WebSocket live tracking endpoint
        location /socket.io/ {
            proxy_pass http://websocket_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # REST API endpoints
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Caching headers for mobile apps
            add_header X-Cache-Status $upstream_cache_status;
        }
    }
}
